<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#126658">
  <meta name="description" content="Your personal offline study companion for Humanities university admission preparation.">
  <title>Admission Companion</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="assets/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/study.css">
  <script src="js/theme-init.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <aside class="sidebar" id="sidebar" aria-label="Main navigation"></aside>
  <div class="workspace">
    <header class="topbar"><div class="breadcrumb-label">Your learning space <span>/</span> <strong id="current-page">Dashboard</strong></div><div class="topbar-actions"><span class="phase-tag" id="offline-status" role="status">Preparing offline files…</span><a class="icon-button" href="#/settings" aria-label="Open settings"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="m9 3-1 3-3 1-2 4 2 2v4l4 3 3-1 3 1 4-3v-4l2-2-2-4-3-1-1-3Z"/><circle cx="12" cy="12" r="3"/></svg></a><button class="icon-button" data-theme-toggle aria-label="Switch to dark theme"></button><a href="#/profile" class="avatar" aria-label="Open profile">S</a></div></header>
    <p class="mobile-offline-status" id="mobile-offline-status" role="status">Preparing offline files…</p>
    <main id="main" tabindex="-1"><div class="empty-state">Loading your learning space…</div></main>
    <footer class="page-footer"><span>Small steps. Remarkable possibilities.</span><span>Made for your next chapter <span aria-hidden="true">↗</span></span></footer>
  </div>
  <nav class="bottom-nav" id="bottom-nav" aria-label="Mobile navigation"></nav>
  <div id="toast" class="app-toast" role="status" aria-live="polite"></div>
  <script>
    // A classic script can explain file:// startup even when ES modules are blocked.
    if (location.protocol === 'file:') {
      document.querySelector('#main').innerHTML = '<section class="panel p-4"><h1>Open through a local server</h1><p class="mt-3">Opening index.html directly from your disk blocks the app modules and offline setup. Waiting will not finish loading.</p><p>Start a static file server inside this extracted folder:</p><pre>py -m http.server 8081 --bind 127.0.0.1</pre><p>Then open <a class="text-link" href="http://127.0.0.1:8081/">http://127.0.0.1:8081/</a>. If your local server is already running, use that link now.</p><p>Your GitHub Pages HTTPS address also works. Local testing instructions are in README.md.</p></section>';
      for (const id of ['offline-status', 'mobile-offline-status']) document.getElementById(id).textContent = 'Local server required';
    }
  </script>
  <noscript><p class="noscript">Please enable JavaScript to use Admission Companion.</p></noscript>
</body>
</html>
